name: Daily Antigravity & Tech Feed Sync

on:
  schedule:
    # Runs every morning at 06:00 UTC (100% free on public repos)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows 1-click manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Feed Sync
        run: |
          python3 scripts/sync_whats_new.py

      - name: Commit & Push if Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add references/whats_new.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(feed): daily sync of Antigravity & Google developer tips [skip ci]"
            git push origin main
            echo "Successfully pushed updated whats_new.json"
          else
            echo "Feed is already up to date. No commit needed."
          fi
